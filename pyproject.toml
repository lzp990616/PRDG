[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "prdg"
version = "0.1.0"
description = "Physics-guided domain generalization for blood cell detection"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
[tool.setuptools.packages.find]
include = ["prdg*", "scripts*"]
